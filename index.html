<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ساخت کادو</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{--ink:#3A3835;--paper:#F5F3EE;--card:#FFFFFF;--accent:#D2F32C;--muted:#7C7872;--shadow:#C6C3BB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Vazirmatn,system-ui,sans-serif;background:var(--paper);color:var(--ink);
  font-size:15px;line-height:1.7;padding-bottom:104px}
header{padding:18px 20px 10px}
header h1{font-size:21px;font-weight:800;letter-spacing:-.6px;margin:0}
header p{margin:2px 0 0;font-size:12.5px;color:var(--muted);font-weight:500}

.stage{position:sticky;top:0;z-index:20;background:var(--paper);padding:4px 20px 14px}
.stage-inner{background:var(--card);border:2px solid var(--ink);border-radius:22px;
  box-shadow:5px 5px 0 var(--shadow);height:266px;overflow:hidden;position:relative;touch-action:none}
#gl{display:block;width:100%;height:100%}
.stage-tag{position:absolute;top:11px;inset-inline-start:13px;font-size:11px;font-weight:700;
  border:2px solid var(--ink);border-radius:999px;padding:2px 10px;background:var(--card);pointer-events:none}
.spin{position:absolute;bottom:10px;inset-inline-end:13px;font-size:10.5px;font-weight:600;
  color:var(--muted);pointer-events:none}

section{padding:0 20px 22px}
h2{font-size:12px;font-weight:800;letter-spacing:.4px;margin:0 0 11px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:2px;background:var(--ink);opacity:.13}
.row{display:flex;gap:9px;flex-wrap:wrap}
.pick{border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:10px 16px;
  font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;
  box-shadow:3px 3px 0 var(--shadow);transition:transform .14s,box-shadow .14s,background .2s,color .2s}
.pick:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.pick[aria-pressed="true"]{background:var(--accent);color:var(--ink);animation:pop .3s ease}
.pick:disabled{opacity:.32;box-shadow:none}
.swatch{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);padding:0;cursor:pointer;
  filter:grayscale(1);opacity:.55;box-shadow:2px 2px 0 var(--shadow);
  transition:filter .25s,opacity .25s,transform .18s}
.swatch[aria-pressed="true"]{filter:none;opacity:1;transform:scale(1.1);animation:pop .3s ease}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
ul.items li{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:10px 13px;
  display:flex;align-items:center;gap:11px;box-shadow:3px 3px 0 var(--shadow)}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);flex:none}
.nm{flex:1;font-size:14px;font-weight:700}
.pr{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.qty{display:flex;align-items:center;gap:4px}
.mini{border:2px solid var(--ink);background:var(--card);font-family:inherit;font-size:16px;font-weight:800;
  line-height:1;width:30px;height:30px;border-radius:9px;cursor:pointer}
.mini:active{background:var(--ink);color:var(--card)}
.mini:disabled{opacity:.3}
.cnt{min-width:20px;text-align:center;font-weight:800}
.empty{border:2px dashed var(--ink);border-radius:14px;padding:14px;text-align:center;font-size:13px;
  font-weight:600;opacity:.55}
.write{width:100%;margin-top:11px;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);
  background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;
  box-shadow:3px 3px 0 var(--shadow)}
.write:focus{outline:none;background:#FCFFF2}
.hint{margin:7px 3px 0;font-size:11.5px;color:var(--muted);font-weight:500}
.bar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--card);border-top:2px solid var(--ink);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px}
.total{flex:1}
.total b{display:block;font-size:21px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.total small{font-size:11.5px;color:var(--muted);font-weight:500}
.buy{background:var(--ink);color:var(--card);border:2px solid var(--ink);border-radius:14px;
  padding:13px 22px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
  box-shadow:3px 3px 0 var(--accent)}
.buy:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--accent)}
@keyframes pop{0%{transform:scale(.9)}55%{transform:scale(1.09)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== GIFTYLE V2 PREVIEW ===== */
#stageBox{background:radial-gradient(circle at 50% 35%,#fff 0,#fbfaf6 52%,#f0ede6 100%)}
.stage-inner::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 32%,transparent 72%,rgba(58,56,53,.035))}
.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.product-card{position:relative;border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:8px 7px 7px;min-height:84px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;text-align:center;font-family:inherit;transition:.14s}
.product-card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.product-card[aria-pressed="true"]{background:var(--accent)}
.product-thumb{height:43px;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1}
.product-name{font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-price{font-size:9.5px;color:var(--muted);font-weight:600}
.product-qty{position:absolute;top:5px;inset-inline-end:5px;min-width:20px;height:20px;border-radius:999px;background:var(--ink);color:white;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.scene-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);pointer-events:none;opacity:0;transition:.2s}
.scene-loading.show{opacity:1}
.legend{font-size:10px;color:var(--muted);margin:-5px 2px 10px}
@media(min-width:700px){.product-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}

</style>
</head>
<body>

<header><h1>کادوی خودت را بچین</h1><p>جعبه را با انگشت بچرخان</p></header>

<div class="stage">
  <div class="stage-inner" id="stageBox">
    <canvas id="gl"></canvas>
    <span class="stage-tag" id="tag">سایز کوچک</span>
    <span class="spin">بکش تا بچرخد</span>
  </div>
</div>

<section><h2>بسته‌بندی</h2><div class="row" id="packs"></div></section>
<section><h2>رنگ بسته‌بندی</h2><div class="row" id="packColors"></div></section>
<section id="msgSection">
  <h2>نوشته روی کارت</h2>
  <div class="row" style="margin-bottom:11px" id="msgLang"></div>
  <div class="row" id="msgs"></div>
  <input id="custom" class="write" maxlength="42" placeholder="یا خودت بنویس — مثلاً صدف جان دلمون تنگه برات">
  <p class="hint">حداکثر 42 نویسه تا روی کارت جا شود</p>
</section>
<section><h2>گل</h2><div class="row" id="flowers"></div>
<div class="row" id="flowerColors" style="margin-top:11px"></div></section>
<section><h2>کاغذ دور گل</h2><div class="row" id="wrapOuter"></div></section>
<section><h2>روبان</h2><div class="row" id="ribbons"></div></section>
<section><h2>خوراکی و افزودنی</h2><p class="legend">روی هر محصول بزن تا به جعبه اضافه شود</p><div class="product-grid" id="addons"></div></section>
<section><h2>داخل کادو</h2><ul class="items" id="list"></ul></section>

<div class="bar">
  <div class="total"><b id="price">0</b><small>تومان — با هر تغییر به‌روز می‌شود</small></div>
  <button class="buy">ثبت سفارش</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===================== داده ===================== */
const PACKS=[{id:"card",name:"کارت‌پستال",price:120000},
             {id:"cone",name:"ساک مخروطی",price:180000},
             {id:"box", name:"جعبه",       price:250000}];
const PACK_COLORS=[{id:"rose",name:"صورتی",hex:"#F09FB2"},{id:"cream",name:"کرم",hex:"#F0D9AF"},
  {id:"sky",name:"آبی",hex:"#8FBBE8"},{id:"sage",name:"سبز",hex:"#7FAE72"},
  {id:"lilac",name:"یاسی",hex:"#B592DC"},{id:"coral",name:"مرجانی",hex:"#F0885F"},
  {id:"teal",name:"سبزآبی",hex:"#4FA7A0"},{id:"coal",name:"ذغالی",hex:"#54505A"}];
const WRAP_COLORS=[{id:"mint",name:"مینتی",hex:"#B9D8CE"},{id:"sky",name:"آبی",hex:"#B7CFE4"},
  {id:"peach",name:"هلویی",hex:"#F0C3A4"},{id:"blush",name:"صورتی",hex:"#EFC3CB"},
  {id:"lav",name:"یاسی",hex:"#C3BCDD"},{id:"kraft",name:"کرافت",hex:"#C8A276"},
  {id:"cream",name:"کرم",hex:"#F2E7D5"},{id:"sage",name:"سبز",hex:"#A9BB9C"},
  {id:"mustard",name:"خردلی",hex:"#D9B65A"},{id:"coal",name:"ذغالی",hex:"#54505A"}];
const FLOWERS=[{id:"gyp",name:"ژیپسوفیلا",price:45000},{id:"daisy",name:"بابونه",price:55000},
  {id:"lav",name:"لاوندر",price:60000},{id:"sun",name:"آفتابگردان",price:70000}];
const FLOWER_COLORS=[{id:"white",name:"سفید",hex:"#FAF6EE"},{id:"blush",name:"صورتی",hex:"#E9AEB8"},
  {id:"butter",name:"زرد",hex:"#EBC96B"},{id:"violet",name:"بنفش",hex:"#9A86C4"}];
const RIBBONS=[{id:"gold",name:"طلایی",hex:"#C9A55C"},{id:"white",name:"سفید",hex:"#F7F3EC"},
  {id:"rose",name:"صورتی",hex:"#D98FA0"},{id:"sap",name:"سبز",hex:"#5C7F49"},
  {id:"coal",name:"ذغالی",hex:"#4A4650"}];
const ADDONS=[
  {id:"snk", name:"اسنیکرز", price:75000, hex:"#9A5F30", art:"bar"},
  {id:"kit", name:"کیت‌کت",   price:55000, hex:"#D6342C", art:"bar"},
  {id:"oreo",name:"اورئو",    price:60000, hex:"#2F6BB8", art:"bar"},
  {id:"mm",  name:"ام‌اند‌ام", price:65000, hex:"#7A4A2A", art:"pouch"},
  {id:"tob", name:"توبلرون",  price:95000, hex:"#E0B03F", art:"prism"},
  {id:"kin", name:"کیندر",    price:70000, hex:"#EFE7D8", art:"carton"},
  {id:"fer", name:"فررو",     price:85000, hex:"#C9A24A", art:"truffle"},
  {id:"soda",name:"نوشابه",   price:40000, hex:"#E23A3A", art:"can"},
  {id:"ram", name:"رامونه",   price:90000, hex:"#7DC242", art:"bottle"},
  {id:"charm",name:"چارم",    price:60000, hex:"#D9AE4E", art:"charm"},
  {id:"note",name:"کارت دست‌نویس",price:15000,hex:"#FFFFFF",art:"note"}];
const MESSAGES=[{en:"Happy Birthday",fa:"تولدت مبارک"},{en:"Happy Anniversary",fa:"سالگردمون مبارک"},
  {en:"Miss You",fa:"دلم برات تنگ شده"},{en:"Happy Mother's Day",fa:"روز مادر مبارک"},
  {en:"Happy Father's Day",fa:"روز پدر مبارک"},{en:"Thank You",fa:"ممنونم ازت"},
  {en:"Get Well Soon",fa:"زود خوب شو"},{en:"Congratulations",fa:"تبریک می‌گم"},
  {en:"I Love You",fa:"دوستت دارم"},{en:"Happy Nowruz",fa:"نوروز مبارک"},
  {en:"Happy Yalda",fa:"شب یلدا مبارک"},{en:"I'm Sorry",fa:"معذرت می‌خوام"},
  {en:"Good Luck",fa:"موفق باشی"},{en:"Happy Graduation",fa:"فارغ‌التحصیلیت مبارک"},
  {en:"Just Because",fa:"همین‌طوری، برای تو"}];
const CAP={card:3,cone:4,box:6};

const state={pack:"box",packColor:"rose",wrapOuter:"mint",flower:"gyp",flowerColor:"white",
  ribbon:"gold",msgLang:"fa",msgIndex:0,custom:"",addons:[]};
const get=(a,id)=>a.find(x=>x.id===id)||a[0];
const hex=(a,id)=>get(a,id).hex;
const flatItems=()=>{const o=[];state.addons.forEach(a=>{for(let i=0;i<a.qty;i++)o.push(a);});return o;};
const slotsUsed=()=>state.addons.reduce((t,a)=>t+a.qty,0);

/* ===================== صحنه سه‌بعدی — Giftyle V2 ===================== */
const OUTLINE=0x3A3835;
let renderer,scene,camera,root,boxGrp,itemsGrp,bouquetGrp,cardMesh,cardTex,ready=false;
let spin=0.35, drag=null, idle=0, clock;

const productEmoji={snk:"🍫",kit:"🍫",oreo:"🍪",mm:"🍬",tob:"🍫",kin:"🍫",fer:"🍫",soda:"🥤",ram:"🧃",charm:"💛",note:"💌"};

function toonRamp(){
  const c=new Uint8Array([70,160,235]);
  const t=new THREE.DataTexture(c,c.length,1,THREE.RedFormat);
  t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;
  return t;
}
let RAMP,OUTMAT;
const MATS=[];
function mat(color,rough=.7){
  const m=new THREE.MeshToonMaterial({color:new THREE.Color(color),gradientMap:RAMP});
  m.userData.rough=rough;MATS.push(m);return m;
}
function piece(geo,color,thick=.04){
  const g=new THREE.Group();
  const m=new THREE.Mesh(geo,mat(color));
  const o=new THREE.Mesh(geo,OUTMAT);
  o.scale.multiplyScalar(1+thick);
  g.add(o,m);g.userData.body=m;return g;
}
function disposeTree(obj){
  obj.traverse(n=>{
    if(n.isMesh){
      n.geometry.dispose();
      if(n.material && n.material.map && n.material.map!==cardTex)n.material.map.dispose?.();
    }
  });
  while(obj.children.length)obj.remove(obj.children[0]);
}
function labelTexture(text,bg,fg="#FFFFFF"){
  const c=document.createElement("canvas");c.width=256;c.height=128;
  const x=c.getContext("2d");x.fillStyle=bg;x.fillRect(0,0,256,128);
  x.fillStyle=fg;x.font="900 34px Arial";x.textAlign="center";x.textBaseline="middle";
  x.fillText(text,128,64);
  const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;t.magFilter=THREE.LinearFilter;return t;
}
function labelPlane(text,bg,fg,w=.3,h=.16){
  const geo=new THREE.PlaneGeometry(w,h);
  const m=new THREE.MeshBasicMaterial({map:labelTexture(text,bg,fg),transparent:true});
  const p=new THREE.Mesh(geo,m);return p;
}

/* Product models are intentionally procedural in this demo:
   no third-party binary asset is bundled, so the GitHub demo works immediately.
   Candidate downloadable assets researched for later replacement:
   - Poly Pizza "Chocolate" by jeremy (CC-BY): https://poly.pizza/m/1PfSi8Y5J4u
   - Sketchfab "Bar of Chocolate" by rhcreations (CC Attribution)
   - Sketchfab "Game Ready | Free Chocolates" by Saritasa (CC Attribution)
   - Sketchfab "Blue Flower Animated" by morphy.vision (CC Attribution)
   glTF/GLB is the recommended runtime format for Three.js. */

function buildItem(kind,color){
  const g=new THREE.Group(),C=new THREE.Color(color);
  const light="#"+C.clone().lerp(new THREE.Color("#ffffff"),.42).getHexString();
  const dark="#"+C.clone().multiplyScalar(.62).getHexString();

  if(kind==="bar"){
    const body=piece(new THREE.BoxGeometry(.48,.88,.16),color,.045);body.position.y=.44;g.add(body);
    for(let y=0;y<3;y++)for(let x=-1;x<=1;x++){
      const s=piece(new THREE.BoxGeometry(.12,.20,.025),light,.025);
      s.position.set(x*.135,.22+y*.22,.09);g.add(s);
    }
    const lab=labelPlane("CHOCOLATE",color,"#fff",.36,.09);lab.position.set(0,.72,.095);g.add(lab);
  }
  else if(kind==="prism"){
    const p=piece(new THREE.CylinderGeometry(.27,.27,.92,3),color,.045);p.position.y=.46;p.rotation.y=Math.PI/6;g.add(p);
    const top=piece(new THREE.CylinderGeometry(.12,.12,.05,3),light,.05);top.position.y=.94;g.add(top);
    const lab=labelPlane("TRIANGLE",light,"#3A3835",.25,.07);lab.position.set(0,.52,.24);lab.rotation.y=.0;g.add(lab);
  }
  else if(kind==="pouch"){
    const b=piece(new THREE.BoxGeometry(.52,.66,.25),color,.045);b.position.y=.34;b.scale.z=.9;g.add(b);
    const seal=piece(new THREE.BoxGeometry(.54,.08,.27),dark,.05);seal.position.y=.68;g.add(seal);
    [["#E0453C",-.16],["#3E88CF",0],["#E8C33F",.16]].forEach(([c,x],i)=>{
      const d=piece(new THREE.SphereGeometry(.065,12,10),c,.04);d.position.set(x,.40+i*.03,.14);g.add(d);
    });
    const lab=labelPlane("CANDY",color,"#fff",.27,.075);lab.position.set(0,.53,.14);g.add(lab);
  }
  else if(kind==="carton"){
    const b=piece(new THREE.BoxGeometry(.44,.86,.31),color,.045);b.position.y=.43;g.add(b);
    const top=piece(new THREE.BoxGeometry(.46,.16,.33),light,.045);top.position.y=.82;g.add(top);
    const lab=labelPlane("KINDER",light,"#C33",.25,.09);lab.position.set(0,.48,.17);g.add(lab);
  }
  else if(kind==="truffle"){
    const cup=piece(new THREE.CylinderGeometry(.26,.21,.15,16),light,.04);cup.position.y=.08;g.add(cup);
    const s=piece(new THREE.SphereGeometry(.22,18,14),color,.045);s.position.y=.31;g.add(s);
    const ring=piece(new THREE.TorusGeometry(.17,.025,8,18),light,.04);ring.position.y=.43;g.add(ring);
  }
  else if(kind==="can"){
    const b=piece(new THREE.CylinderGeometry(.225,.225,.72,20),color,.04);b.position.y=.36;g.add(b);
    const top=piece(new THREE.CylinderGeometry(.23,.23,.055,20),light,.04);top.position.y=.735;g.add(top);
    const tab=piece(new THREE.TorusGeometry(.055,.012,6,14),dark,.04);tab.position.set(0,.77,0);g.add(tab);
    const lab=labelPlane("DRINK",color,"#fff",.25,.075);lab.position.set(0,.37,.23);g.add(lab);
  }
  else if(kind==="bottle"){
    const b=piece(new THREE.CylinderGeometry(.2,.23,.60,18),color,.04);b.position.y=.30;g.add(b);
    const neck=piece(new THREE.CylinderGeometry(.09,.14,.25,18),color,.045);neck.position.y=.72;g.add(neck);
    const cap=piece(new THREE.CylinderGeometry(.105,.105,.10,18),light,.045);cap.position.y=.895;g.add(cap);
    const lab=labelPlane("RAMUNE","#FFFDF8","#3A3835",.23,.10);lab.position.set(0,.30,.225);g.add(lab);
  }
  else if(kind==="charm"){
    const ring=piece(new THREE.TorusGeometry(.11,.028,8,18),color,.05);ring.position.y=.78;g.add(ring);
    const h=piece(new THREE.SphereGeometry(.18,14,12),light,.05);h.position.y=.43;h.scale.set(1,.82,.55);g.add(h);
    const stem=piece(new THREE.CylinderGeometry(.018,.018,.32,8),dark,.04);stem.position.y=.62;g.add(stem);
    const heart=piece(new THREE.SphereGeometry(.08,10,8),color,.03);heart.position.set(0,.43,.10);heart.scale.set(1,.8,.45);g.add(heart);
  }
  else{
    const paper=piece(new THREE.BoxGeometry(.58,.42,.035),color,.045);paper.position.y=.21;paper.rotation.x=-.12;g.add(paper);
    const line1=piece(new THREE.BoxGeometry(.30,.018,.04),"#B9AFC2",.04);line1.position.set(0,.25,.025);g.add(line1);
    const line2=piece(new THREE.BoxGeometry(.22,.018,.04),"#B9AFC2",.04);line2.position.set(0,.17,.025);g.add(line2);
  }
  return g;
}

/* Better stylized bouquet: stems + petals instead of spheres only */
function flowerHead(kind,fc){
  const g=new THREE.Group();
  const petals=kind==="sun"?12:kind==="daisy"?10:6;
  for(let i=0;i<petals;i++){
    const a=i/petals*Math.PI*2;
    const p=piece(new THREE.SphereGeometry(kind==="sun"?.075:.065,10,8),fc,.035);
    p.scale.set(kind==="lav"?.65:1,kind==="lav"?1.7:1.15,.55);
    p.position.set(Math.cos(a)*.10,.02,Math.sin(a)*.10);p.rotation.y=-a;g.add(p);
  }
  const center=piece(new THREE.SphereGeometry(kind==="sun"?.105:.07,12,10),kind==="sun"?"#6B4A28":"#E9C95F",.035);
  center.position.y=.03;g.add(center);
  return g;
}
function buildBouquet(){
  const g=new THREE.Group();
  const wrap=hex(WRAP_COLORS,state.wrapOuter),fc=hex(FLOWER_COLORS,state.flowerColor),rc=hex(RIBBONS,state.ribbon),kind=state.flower;
  const cone=piece(new THREE.CylinderGeometry(.54,.16,.98,12,1,true),wrap,.03);cone.position.y=.49;g.add(cone);
  const fold=piece(new THREE.BoxGeometry(.72,.025,.025),"#ffffff",.02);fold.position.set(0,.35,.48);g.add(fold);
  const bow=piece(new THREE.TorusGeometry(.13,.045,8,14),rc,.05);bow.position.set(0,.13,.48);bow.rotation.x=Math.PI/2;g.add(bow);
  const n=kind==="sun"?7:kind==="lav"?8:10;
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2,r=.08+(i%3)*.11;
    const stem=piece(new THREE.CylinderGeometry(.012,.012,.8,6), "#5D7F4D",.02);
    stem.position.set(Math.cos(a)*r,.72,Math.sin(a)*r*.65);stem.rotation.z=Math.cos(a)*.15;stem.rotation.x=Math.sin(a)*.12;g.add(stem);
    const f=flowerHead(kind,fc);f.position.set(Math.cos(a)*r,1.12+((i*37)%9)/80,Math.sin(a)*r*.65);g.add(f);
  }
  return g;
}

function buildPack(){
  const g=new THREE.Group(),pc=hex(PACK_COLORS,state.packColor),C=new THREE.Color(pc);
  const light="#"+C.clone().lerp(new THREE.Color("#ffffff"),.30).getHexString(),dark="#"+C.clone().multiplyScalar(.78).getHexString();
  if(state.pack==="box"){
    const W=2.55,D=1.58,H=1.03,T=.075;
    const floor=piece(new THREE.BoxGeometry(W,T,D),dark,.02);floor.position.y=T/2;g.add(floor);
    [[0,-D/2+T/2,W,T],[0,D/2-T/2,W,T]].forEach(([x,z,w])=>{const p=piece(new THREE.BoxGeometry(w,H,T),pc,.02);p.position.set(x,H/2,z);g.add(p);});
    [[-W/2+T/2],[W/2-T/2]].forEach(([x])=>{const p=piece(new THREE.BoxGeometry(T,H,D),pc,.02);p.position.set(x,H/2,0);g.add(p);});
    const band=piece(new THREE.BoxGeometry(.30,H+.02,D+.02),light,.02);band.position.y=H/2;g.add(band);
    const lid=piece(new THREE.BoxGeometry(W+.14,.12,D+.14),light,.03);lid.position.set(-W*.72,H*.55,-.3);lid.rotation.z=.42;lid.rotation.y=-.25;g.add(lid);
    g.userData.slotY=T;
  }
  if(state.pack==="cone"){
    const bag=piece(new THREE.CylinderGeometry(.94,.50,1.52,16,1,true),pc,.025);bag.position.y=.76;g.add(bag);
    const base=piece(new THREE.CylinderGeometry(.50,.50,.06,16),dark,.04);base.position.y=.03;g.add(base);
    const h=piece(new THREE.TorusGeometry(.5,.05,8,20,Math.PI),dark,.05);h.position.y=1.52;h.rotation.y=Math.PI/2;g.add(h);
    g.userData.slotY=.06;
  }
  if(state.pack==="card"){
    const c=piece(new THREE.BoxGeometry(1.7,2.3,.05),pc,.02);c.position.y=1.15;g.add(c);
    const face=new THREE.Mesh(new THREE.PlaneGeometry(1.5,2.1),new THREE.MeshBasicMaterial({map:cardTex,transparent:true}));face.position.set(0,1.15,.032);g.add(face);
    const stand=piece(new THREE.BoxGeometry(1.2,.06,.5),dark,.03);stand.position.y=.03;g.add(stand);g.userData.slotY=.06;
  }
  return g;
}

function slots(n){
  const cfg={
    box:{w:1.85,rows:[-.34,.30],y:.09},
    cone:{w:.92,rows:[-.18,.18],y:.09},
    card:{w:1.78,rows:[.34],y:.08}
  }[state.pack];
  const rows=cfg.rows.length===1?[cfg.rows[0]]:(n<=3?[cfg.rows[1]]:cfg.rows);
  const per=Math.ceil(n/rows.length),out=[];let i=0;
  rows.forEach(z=>{
    const cnt=Math.min(per,n-i);
    for(let k=0;k<cnt;k++,i++){
      const t=cnt===1?.5:k/(cnt-1);
      out.push({x:(t-.5)*cfg.w*(cnt===1?0:1),z,y:cfg.y,rot:((k*37)%13-6)*Math.PI/180});
    }
  });
  return out;
}

function rebuildScene(){
  if(!ready)return;
  disposeTree(boxGrp);disposeTree(itemsGrp);disposeTree(bouquetGrp);MATS.length=0;
  const pack=buildPack();boxGrp.add(pack);
  const bq=buildBouquet();
  bq.position.set(0,pack.userData.slotY,state.pack==="box"?-.42:(state.pack==="card"?.10:0));
  if(state.pack==="card"){bq.position.y=.06;bq.position.z=.12;bq.scale.setScalar(.80)}
  if(state.pack==="cone"){bq.position.y=.88;bq.scale.setScalar(.92)}
  bouquetGrp.add(bq);
  const F=flatItems(),P=slots(F.length);
  F.forEach((it,i)=>{
    const m=buildItem(it.art,it.hex);m.position.set(P[i].x,P[i].y,P[i].z);m.rotation.y=P[i].rot;
    m.userData.t=0;m.userData.target=.0;itemsGrp.add(m);
  });
}

function init3D(){
  const canvas=document.getElementById("gl"),holder=document.getElementById("stageBox");
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setClearColor(0x000000,0);
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(31,1,.1,50);
  RAMP=toonRamp();OUTMAT=new THREE.MeshBasicMaterial({color:OUTLINE,side:THREE.BackSide});
  scene.add(new THREE.HemisphereLight(0xffffff,0xB8B2A7,.95));
  const key=new THREE.DirectionalLight(0xffffff,1.0);key.position.set(3,5,4);scene.add(key);
  const fill=new THREE.DirectionalLight(0xffffff,.38);fill.position.set(-4,2,-3);scene.add(fill);
  root=new THREE.Group();scene.add(root);boxGrp=new THREE.Group();itemsGrp=new THREE.Group();bouquetGrp=new THREE.Group();root.add(boxGrp,itemsGrp,bouquetGrp);
  const sh=new THREE.Mesh(new THREE.CircleGeometry(1.8,40),new THREE.MeshBasicMaterial({color:0x3A3835,transparent:true,opacity:.08}));
  sh.rotation.x=-Math.PI/2;sh.position.y=-.01;root.add(sh);
  function resize(){const w=holder.clientWidth,h=holder.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();camera.position.set(0,2.65,4.85);camera.lookAt(0,.82,0)}
  addEventListener("resize",resize);resize();
  holder.addEventListener("pointerdown",e=>{drag=e.clientX;idle=0});
  addEventListener("pointermove",e=>{if(drag!==null){spin+=(e.clientX-drag)*.007;drag=e.clientX}});
  addEventListener("pointerup",()=>drag=null);
  clock=new THREE.Clock();
  (function loop(){requestAnimationFrame(loop);const dt=clock.getDelta();if(drag===null){idle+=dt;if(idle>2.5)spin+=dt*.25}
    root.rotation.y=spin;
    itemsGrp.children.forEach(m=>{if(m.userData.t<1){m.userData.t=Math.min(1,m.userData.t+dt*3.8);const t=m.userData.t,e=1-Math.pow(1-t,3);m.scale.setScalar(.35+.65*e+Math.sin(e*Math.PI)*.10);}});
    renderer.render(scene,camera);
  })();
  ready=true;
}

/* ---------- بافت متن کارت ---------- */
function makeCardTexture(){const c=document.createElement("canvas");c.width=440;c.height=616;cardTex=new THREE.CanvasTexture(c);cardTex.anisotropy=2;cardTex.userData={canvas:c};return cardTex}
function paintCard(){if(!cardTex)return;const c=cardTex.userData.canvas,x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);x.fillStyle="#FFFDF8";x.strokeStyle="#3A3835";x.lineWidth=6;roundRect(x,18,18,c.width-36,c.height-36,22);x.fill();x.stroke();const txt=cardText(),size=txt.length<=16?46:txt.length<=30?38:32;x.fillStyle="#3A3835";x.direction="rtl";x.textAlign="center";x.font="800 "+size+"px Vazirmatn, sans-serif";wrapLines(txt,txt.length<=16?18:22).forEach((ln,i)=>x.fillText(ln,c.width/2,110+i*size*1.3));cardTex.needsUpdate=true}
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function cardText(){const t=state.custom.trim();if(t)return t;const m=MESSAGES[state.msgIndex];return state.msgLang==="fa"?m.fa:m.en}
function wrapLines(t,max){const w=t.split(/\s+/),o=[];let c="";w.forEach(y=>{if((c+" "+y).trim().length<=max)c=(c+" "+y).trim();else{if(c)o.push(c);c=y}});if(c)o.push(c);return o.slice(0,3)}

/* ===================== رابط ===================== */
const fmt=n=>n.toLocaleString("en-US");
function total(){let t=get(PACKS,state.pack).price+get(FLOWERS,state.flower).price;
  state.addons.forEach(a=>t+=a.price*a.qty);return t;}
function chips(el,arr,sel,on){el.innerHTML="";
  arr.forEach(o=>{const b=document.createElement("button");b.className="pick";b.textContent=o.name;
    b.setAttribute("aria-pressed",String(sel()===o.id));b.onclick=()=>{on(o.id);render();};el.appendChild(b);});}
function swatches(el,arr,sel,on){el.innerHTML="";
  arr.forEach(o=>{const b=document.createElement("button");b.className="swatch";b.style.background=o.hex;
    b.title=o.name;b.setAttribute("aria-label",o.name);b.setAttribute("aria-pressed",String(sel()===o.id));
    b.onclick=()=>{on(o.id);render();};el.appendChild(b);});}
function renderAddons(){
  const el=document.getElementById("addons");el.innerHTML="";
  const full=slotsUsed()>=CAP[state.pack];
  ADDONS.forEach(o=>{
    const cur=state.addons.find(a=>a.id===o.id);
    const b=document.createElement("button");b.className="product-card";
    b.setAttribute("aria-pressed",String(!!cur));b.disabled=full&&!cur;
    b.innerHTML=`<span class="product-thumb">${productEmoji[o.id]||"🎁"}</span>
      <span class="product-name">${o.name}</span>
      <span class="product-price">${fmt(o.price)} تومان</span>${cur?`<span class="product-qty">${cur.qty}</span>`:""}`;
    b.onclick=()=>{if(slotsUsed()>=CAP[state.pack])return;if(cur)cur.qty++;else state.addons.push({...o,qty:1});render()};
    el.appendChild(b);
  });
}

document.getElementById("custom").addEventListener("input",e=>{
  state.custom=e.target.value;
  paintCard();
  if(state.pack==="card") rebuildScene();
});

makeCardTexture();
init3D();
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(paintCard);
</script>
